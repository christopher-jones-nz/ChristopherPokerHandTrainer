<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Pre-Flop Range Trainer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="top-nav">
      <span class="brand">RFI Pre-Flop Trainer</span>
      <nav class="nav-tabs">
        <button class="nav-tab active" id="tabTrainer">Trainer</button>
        <button class="nav-tab" id="tabCharts">Range Charts</button>
      </nav>
    </header>

    <!-- Page 1: Flashcard Trainer -->
    <div class="page" id="pageTrainer">
      <div class="mode-bar" id="trainerModeBar"></div>

      <div class="layout">
        <aside class="sidebar">
          <div class="sidebar-header">
            <span>Mistakes</span>
            <span class="mistake-count" id="mistakeCount">0</span>
          </div>
          <button class="btn-replay" id="replayBtn" disabled>
            Replay Mistakes
          </button>
          <div class="mistake-list" id="mistakeList">
            <div class="mistake-empty">No mistakes yet</div>
          </div>
        </aside>

        <main class="app">
          <div class="scoreboard">
            <div class="stat-box">
              <div class="stat-label">Streak</div>
              <div class="stat-value" id="streak">0</div>
            </div>
            <div class="stat-box">
              <div class="stat-label">Session Best</div>
              <div class="stat-value highlight" id="highScore">0</div>
            </div>
            <div class="stat-box">
              <div class="stat-label">Previous</div>
              <div class="stat-value" id="prevScore">-</div>
            </div>
          </div>

          <div class="board" id="board">
            <div class="replay-banner" id="replayBanner">Replay Mode</div>
            <div class="position-badge" id="position">Button</div>
            <div class="cards-container" id="cardsContainer"></div>
            <div class="feedback" id="feedback"></div>
          </div>

          <div class="controls">
            <button class="btn-fold" id="foldBtn">FOLD</button>
            <button class="btn-raise" id="raiseBtn">RAISE</button>
          </div>

          <div class="hint">
            Shortcuts: [F] or [←] Fold &nbsp;|&nbsp; [R] or [→] Raise
          </div>
        </main>
      </div>
    </div>

    <!-- Page 2: Read-Only 13x13 Range Charts -->
    <div class="page hidden" id="pageCharts">
      <div class="charts-container">
        <div class="pos-toggle-bar" id="posToggleBar"></div>

        <div class="chart-meta">
          <div class="legend">
            <span class="legend-item"
              ><span class="legend-swatch swatch-green"></span>Raise</span
            >
            <span class="legend-item"
              ><span class="legend-swatch swatch-blue"></span>Fold</span
            >
          </div>
          <span id="rangeStats">0% (0 combos)</span>
        </div>

        <div class="matrix-grid" id="matrixGrid"></div>
      </div>
    </div>

    <script src="ranges.js"></script>
    <script src="app.js"></script>
  </body>
</html>
