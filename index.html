<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Pre-Flop Range Trainer</title>
    <style>
      :root {
        --bg: #121417;
        --card-bg: #1e2229;
        --panel-bg: #181b20;
        --text: #f1f3f5;
        --muted: #868e96;
        --fold: #e03131;
        --fold-hover: #c92a2a;
        --raise: #2f9e44;
        --raise-hover: #2b8a3e;
        --accent: #3b82f6;
        --accent-hover: #2563eb;
        --border: #2c313a;

        /* Muted cool tones for 13x13 range grid */
        --cell-blue-bg: #1c2736;
        --cell-blue-border: #27364a;
        --cell-blue-text: #748ca8;
        --cell-green-bg: #1b3631;
        --cell-green-border: #285048;
        --cell-green-text: #7cc4b0;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      body {
        background: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100dvh;
        padding: 16px;
        user-select: none;
      }

      /* Top Page Navigation */
      .top-nav {
        width: 100%;
        max-width: 680px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 18px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--border);
      }

      .brand {
        font-size: 0.95rem;
        font-weight: 700;
        color: var(--text);
        letter-spacing: 0.2px;
      }

      .nav-tabs {
        display: flex;
        background: var(--panel-bg);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 3px;
        gap: 4px;
      }

      .nav-tab {
        background: transparent;
        border: none;
        color: var(--muted);
        font-size: 0.85rem;
        font-weight: 600;
        padding: 6px 14px;
        border-radius: 7px;
        cursor: pointer;
        transition:
          background-color 0.15s ease,
          color 0.15s ease;
      }

      .nav-tab:hover {
        color: var(--text);
      }

      .nav-tab.active {
        background: #2b303b;
        color: var(--text);
      }

      .page {
        width: 100%;
        max-width: 680px;
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 16px;
      }

      .page.hidden {
        display: none;
      }

      /* Position / Puzzle Mode Bar */
      .mode-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        background: var(--panel-bg);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 5px;
      }

      .mode-btn {
        flex: 1 1 auto;
        background: transparent;
        border: 1px solid transparent;
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 600;
        padding: 8px 10px;
        border-radius: 8px;
        cursor: pointer;
        transition:
          background-color 0.15s ease,
          color 0.15s ease,
          border-color 0.15s ease;
      }

      .mode-btn:hover {
        color: var(--text);
      }

      .mode-btn.active {
        background: #242b38;
        border-color: #364154;
        color: #a5d8ff;
      }

      /* Trainer Page Layout */
      .layout {
        width: 100%;
        display: grid;
        grid-template-columns: 220px 1fr;
        gap: 20px;
        align-items: stretch;
      }

      /* LHS Mistakes Stack */
      .sidebar {
        background: var(--panel-bg);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        max-height: 460px;
      }

      .sidebar-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.85rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--muted);
      }

      .mistake-count {
        background: #2b303b;
        color: #ff8787;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 0.75rem;
      }

      .btn-replay {
        width: 100%;
        padding: 10px 12px;
        font-size: 0.85rem;
        font-weight: 700;
        border-radius: 10px;
        background: var(--accent);
        color: white;
        border: none;
        cursor: pointer;
        transition:
          background-color 0.15s ease,
          opacity 0.15s ease;
      }

      .btn-replay:hover:not(:disabled) {
        background: var(--accent-hover);
      }
      .btn-replay:disabled {
        background: #252932;
        color: var(--muted);
        cursor: not-allowed;
      }

      .btn-replay.active {
        background: #e67700;
      }
      .btn-replay.active:hover {
        background: #d9480f;
      }

      .mistake-list {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding-right: 2px;
      }

      .mistake-empty {
        color: var(--muted);
        font-size: 0.8rem;
        text-align: center;
        margin: auto 0;
        padding: 16px 8px;
      }

      .mistake-item {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.85rem;
      }

      .mistake-item.current {
        border-color: #f59f00;
        background: rgba(245, 159, 0, 0.12);
      }

      .mistake-hand {
        font-weight: 800;
        color: var(--text);
      }

      .mistake-pos {
        font-size: 0.72rem;
        color: var(--muted);
        text-align: right;
      }

      /* Main Trainer Area */
      .app {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .scoreboard {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }

      .stat-box {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 10px 8px;
        text-align: center;
      }

      .stat-label {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.6px;
        color: var(--muted);
        margin-bottom: 4px;
      }

      .stat-value {
        font-size: 1.35rem;
        font-weight: 800;
        color: var(--text);
      }

      .stat-value.highlight {
        color: #69db7c;
      }

      .board {
        background: var(--card-bg);
        border: 2px solid var(--border);
        border-radius: 16px;
        padding: 36px 24px;
        text-align: center;
        position: relative;
        transition:
          border-color 0.15s ease,
          background-color 0.15s ease;
      }

      .board.correct {
        border-color: var(--raise);
        background: rgba(47, 158, 68, 0.12);
      }
      .board.wrong {
        border-color: var(--fold);
        background: rgba(224, 49, 49, 0.12);
      }

      .replay-banner {
        display: none;
        font-size: 0.72rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        color: #fcc419;
        margin-bottom: 10px;
      }

      .position-badge {
        display: inline-block;
        background: #2b303b;
        color: #a5d8ff;
        font-weight: 600;
        font-size: 0.95rem;
        padding: 6px 14px;
        border-radius: 999px;
        margin-bottom: 20px;
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }

      .hand-display {
        font-size: 4.5rem;
        font-weight: 800;
        letter-spacing: -2px;
        line-height: 1;
        margin-bottom: 16px;
      }

      .feedback {
        min-height: 24px;
        font-size: 1rem;
        font-weight: 600;
      }

      .controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }

      .controls button {
        border: none;
        border-radius: 12px;
        padding: 20px;
        font-size: 1.25rem;
        font-weight: 700;
        color: white;
        cursor: pointer;
        transition:
          transform 0.05s ease,
          background-color 0.15s ease;
      }

      .controls button:active {
        transform: scale(0.97);
      }
      .btn-fold {
        background: var(--fold);
      }
      .btn-fold:hover {
        background: var(--fold-hover);
      }
      .btn-raise {
        background: var(--raise);
      }
      .btn-raise:hover {
        background: var(--raise-hover);
      }

      .hint {
        text-align: center;
        font-size: 0.8rem;
        color: var(--muted);
      }

      /* Range Charts Page */
      .charts-container {
        width: 100%;
        max-width: 560px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .pos-toggle-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        background: var(--panel-bg);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 5px;
      }

      .pos-toggle-btn {
        flex: 1;
        min-width: 90px;
        background: transparent;
        border: 1px solid transparent;
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 600;
        padding: 8px 10px;
        border-radius: 8px;
        cursor: pointer;
        transition:
          background-color 0.15s ease,
          color 0.15s ease,
          border-color 0.15s ease;
      }

      .pos-toggle-btn:hover {
        color: var(--text);
      }

      .pos-toggle-btn.active {
        background: var(--cell-green-bg);
        border-color: var(--cell-green-border);
        color: var(--cell-green-text);
      }

      .chart-meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.8rem;
        color: var(--muted);
        padding: 0 2px;
      }

      .legend {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .legend-item {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .legend-swatch {
        width: 12px;
        height: 12px;
        border-radius: 3px;
      }

      .swatch-blue {
        background: var(--cell-blue-bg);
        border: 1px solid var(--cell-blue-border);
      }

      .swatch-green {
        background: var(--cell-green-bg);
        border: 1px solid var(--cell-green-border);
      }

      .matrix-grid {
        display: grid;
        grid-template-columns: repeat(13, 1fr);
        gap: 3px;
        background: var(--panel-bg);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 8px;
      }

      .matrix-cell {
        aspect-ratio: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.72rem;
        font-weight: 600;
        border-radius: 4px;
        background: var(--cell-blue-bg);
        border: 1px solid var(--cell-blue-border);
        color: var(--cell-blue-text);
        letter-spacing: -0.3px;
      }

      .matrix-cell.in-range {
        background: var(--cell-green-bg);
        border-color: var(--cell-green-border);
        color: var(--cell-green-text);
      }

      @media (max-width: 640px) {
        .layout {
          grid-template-columns: 1fr;
          max-width: 420px;
          margin: 0 auto;
        }
        .mode-bar {
          max-width: 420px;
          margin: 0 auto;
          width: 100%;
        }
        .sidebar {
          order: 2;
          max-height: 220px;
        }
        .app {
          order: 1;
        }
        .matrix-grid {
          gap: 2px;
          padding: 5px;
        }
        .matrix-cell {
          font-size: 0.56rem;
          border-radius: 3px;
        }
      }
    </style>
  </head>
  <body>
    <header class="top-nav">
      <span class="brand">RFI Pre-Flop Trainer</span>
      <nav class="nav-tabs">
        <button class="nav-tab active" id="tabTrainer">Trainer</button>
        <button class="nav-tab" id="tabCharts">Range Charts</button>
      </nav>
    </header>

    <!-- Page 1: Flashcard Trainer -->
    <div class="page" id="pageTrainer">
      <div class="mode-bar" id="trainerModeBar"></div>

      <div class="layout">
        <!-- LHS Mistakes Stack -->
        <aside class="sidebar">
          <div class="sidebar-header">
            <span>Mistakes</span>
            <span class="mistake-count" id="mistakeCount">0</span>
          </div>
          <button class="btn-replay" id="replayBtn" disabled>
            Replay Mistakes
          </button>
          <div class="mistake-list" id="mistakeList">
            <div class="mistake-empty">No mistakes yet</div>
          </div>
        </aside>

        <!-- Main Trainer -->
        <main class="app">
          <div class="scoreboard">
            <div class="stat-box">
              <div class="stat-label">Streak</div>
              <div class="stat-value" id="streak">0</div>
            </div>
            <div class="stat-box">
              <div class="stat-label">Session Best</div>
              <div class="stat-value highlight" id="highScore">0</div>
            </div>
            <div class="stat-box">
              <div class="stat-label">Previous</div>
              <div class="stat-value" id="prevScore">-</div>
            </div>
          </div>

          <div class="board" id="board">
            <div class="replay-banner" id="replayBanner">Replay Mode</div>
            <div class="position-badge" id="position">Button</div>
            <div class="hand-display" id="hand">AKo</div>
            <div class="feedback" id="feedback"></div>
          </div>

          <div class="controls">
            <button class="btn-fold" id="foldBtn">FOLD</button>
            <button class="btn-raise" id="raiseBtn">RAISE</button>
          </div>

          <div class="hint">
            Shortcuts: [F] or [←] Fold &nbsp;|&nbsp; [R] or [→] Raise
          </div>
        </main>
      </div>
    </div>

    <!-- Page 2: Read-Only 13x13 Range Charts -->
    <div class="page hidden" id="pageCharts">
      <div class="charts-container">
        <div class="pos-toggle-bar" id="posToggleBar"></div>

        <div class="chart-meta">
          <div class="legend">
            <span class="legend-item"
              ><span class="legend-swatch swatch-green"></span>Raise</span
            >
            <span class="legend-item"
              ><span class="legend-swatch swatch-blue"></span>Fold</span
            >
          </div>
          <span id="rangeStats">0% (0 combos)</span>
        </div>

        <div class="matrix-grid" id="matrixGrid"></div>
      </div>
    </div>

    <script src="ranges.js"></script>

    <script>
      if (typeof RAW_RANGES === "undefined") {
        document.getElementById("feedback").textContent =
          "Error: ranges.js failed to load.";
        document.getElementById("feedback").style.color = "#ff8787";
        throw new Error(
          "RAW_RANGES is undefined. Ensure ranges.js is in the same directory.",
        );
      }

      const RANKS = [
        "A",
        "K",
        "Q",
        "J",
        "T",
        "9",
        "8",
        "7",
        "6",
        "5",
        "4",
        "3",
        "2",
      ];

      function parseHandPart(part) {
        return {
          r1: RANKS.indexOf(part[0]),
          r2: RANKS.indexOf(part[1]),
          type: part.slice(2),
        };
      }

      function expandRange(tokens) {
        const set = new Set();

        for (const rawToken of tokens) {
          const token = rawToken.trim();

          if (/os\+?$|so\+?$/.test(token)) {
            const expanded = expandRange([
              token.replace(/os|so/, "o"),
              token.replace(/os|so/, "s"),
            ]);
            expanded.forEach((h) => set.add(h));
            continue;
          }

          const isPlus = token.endsWith("+");
          const clean = isPlus ? token.slice(0, -1) : token;

          if (clean.includes("-")) {
            const [startStr, endStr] = clean.split("-");
            const start = parseHandPart(startStr);
            const end = parseHandPart(endStr);
            const type = start.type || end.type;

            if (start.r1 < 0 || start.r2 < 0 || end.r1 < 0 || end.r2 < 0) {
              console.warn(`Invalid range token: ${rawToken}`);
              continue;
            }

            const d1 = end.r1 - start.r1;
            const d2 = end.r2 - start.r2;

            if (start.r1 === start.r2 && end.r1 === end.r2) {
              const step = Math.sign(d1) || 1;
              for (
                let i = start.r1;
                step > 0 ? i <= end.r1 : i >= end.r1;
                i += step
              ) {
                set.add(RANKS[i] + RANKS[i]);
              }
            } else if (d1 === 0) {
              const step = Math.sign(d2) || 1;
              for (
                let i = start.r2;
                step > 0 ? i <= end.r2 : i >= end.r2;
                i += step
              ) {
                set.add(RANKS[start.r1] + RANKS[i] + type);
              }
            } else if (d1 === d2) {
              const steps = Math.abs(d1);
              const step = Math.sign(d1);
              for (let k = 0; k <= steps; k++) {
                set.add(
                  RANKS[start.r1 + k * step] +
                    RANKS[start.r2 + k * step] +
                    type,
                );
              }
              if (isPlus) {
                let up1 = start.r1 - 1;
                let up2 = start.r2 - 1;
                while (up1 >= 0 && up2 >= 0) {
                  set.add(RANKS[up1] + RANKS[up2] + type);
                  up1--;
                  up2--;
                }
              }
            } else {
              console.warn(`Unsupported dash range format: ${rawToken}`);
            }
            continue;
          }

          const { r1, r2, type } = parseHandPart(clean);
          if (r1 < 0 || r2 < 0) {
            console.warn(`Invalid hand token: ${rawToken}`);
            continue;
          }

          if (!isPlus) {
            set.add(clean);
            continue;
          }

          if (r1 === r2) {
            for (let i = r1; i >= 0; i--) set.add(RANKS[i] + RANKS[i]);
          } else {
            for (let i = r2; i > r1; i--) set.add(RANKS[r1] + RANKS[i] + type);
          }
        }

        return set;
      }

      const RANGES = Object.fromEntries(
        Object.entries(RAW_RANGES).map(([pos, tokens]) => [
          pos,
          expandRange(tokens),
        ]),
      );
      const POSITIONS = Object.keys(RANGES);
      const MODES = ["Random", ...POSITIONS];

      // Navigation state
      let activePage = "trainer";
      let selectedChartPos = POSITIONS[0];

      const tabTrainerEl = document.getElementById("tabTrainer");
      const tabChartsEl = document.getElementById("tabCharts");
      const pageTrainerEl = document.getElementById("pageTrainer");
      const pageChartsEl = document.getElementById("pageCharts");
      const trainerModeBarEl = document.getElementById("trainerModeBar");
      const posToggleBarEl = document.getElementById("posToggleBar");
      const matrixGridEl = document.getElementById("matrixGrid");
      const rangeStatsEl = document.getElementById("rangeStats");

      function switchPage(page) {
        activePage = page;
        const isTrainer = page === "trainer";
        tabTrainerEl.classList.toggle("active", isTrainer);
        tabChartsEl.classList.toggle("active", !isTrainer);
        pageTrainerEl.classList.toggle("hidden", !isTrainer);
        pageChartsEl.classList.toggle("hidden", isTrainer);

        if (!isTrainer) {
          renderChartView();
        }
      }

      tabTrainerEl.addEventListener("click", () => switchPage("trainer"));
      tabChartsEl.addEventListener("click", () => switchPage("charts"));

      // Build Position Toggle Buttons for Chart View
      function initChartToggles() {
        posToggleBarEl.innerHTML = POSITIONS.map(
          (pos) => `
        <button class="pos-toggle-btn ${pos === selectedChartPos ? "active" : ""}" data-pos="${pos}">
          ${pos}
        </button>
      `,
        ).join("");

        posToggleBarEl.querySelectorAll(".pos-toggle-btn").forEach((btn) => {
          btn.addEventListener("click", () => {
            selectedChartPos = btn.dataset.pos;
            renderChartView();
          });
        });
      }

      function renderChartView() {
        posToggleBarEl.querySelectorAll(".pos-toggle-btn").forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.pos === selectedChartPos);
        });

        const activeSet = RANGES[selectedChartPos];
        let combos = 0;
        const cellsHtml = [];

        for (let r = 0; r < 13; r++) {
          for (let c = 0; c < 13; c++) {
            let label = "";
            let cellCombos = 0;

            if (r === c) {
              label = RANKS[r] + RANKS[c];
              cellCombos = 6;
            } else if (r < c) {
              label = RANKS[r] + RANKS[c] + "s";
              cellCombos = 4;
            } else {
              label = RANKS[c] + RANKS[r] + "o";
              cellCombos = 12;
            }

            const inRange = activeSet.has(label);
            if (inRange) combos += cellCombos;

            cellsHtml.push(
              `<div class="matrix-cell ${inRange ? "in-range" : ""}">${label}</div>`,
            );
          }
        }

        matrixGridEl.innerHTML = cellsHtml.join("");
        const pct = ((combos / 1326) * 100).toFixed(1);
        rangeStatsEl.textContent = `${pct}% (${combos} combos)`;
      }

      // Independent Puzzle State per Mode
      let selectedMode = "Random";
      const puzzleStates = Object.fromEntries(
        MODES.map((mode) => [
          mode,
          {
            streak: 0,
            highScore: 0,
            prevScore: null,
            mistakes: [],
            isReplaying: false,
          },
        ]),
      );

      function getState() {
        return puzzleStates[selectedMode];
      }

      let currentHand = "";
      let currentPos = "";
      let locked = false;
      let nextTimer = null;

      const boardEl = document.getElementById("board");
      const posEl = document.getElementById("position");
      const handEl = document.getElementById("hand");
      const feedbackEl = document.getElementById("feedback");
      const streakEl = document.getElementById("streak");
      const highScoreEl = document.getElementById("highScore");
      const prevScoreEl = document.getElementById("prevScore");
      const replayBannerEl = document.getElementById("replayBanner");
      const replayBtnEl = document.getElementById("replayBtn");
      const mistakeCountEl = document.getElementById("mistakeCount");
      const mistakeListEl = document.getElementById("mistakeList");

      function initTrainerModes() {
        trainerModeBarEl.innerHTML = MODES.map(
          (mode) => `
        <button class="mode-btn ${mode === selectedMode ? "active" : ""}" data-mode="${mode}">
          ${mode}
        </button>
      `,
        ).join("");

        trainerModeBarEl.querySelectorAll(".mode-btn").forEach((btn) => {
          btn.addEventListener("click", () => {
            selectTrainerMode(btn.dataset.mode);
          });
        });
      }

      function selectTrainerMode(mode) {
        if (selectedMode === mode) return;
        clearTimeout(nextTimer);
        selectedMode = mode;

        trainerModeBarEl.querySelectorAll(".mode-btn").forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.mode === selectedMode);
        });

        updateScoreboard();
        nextCard();
      }

      function updateScoreboard() {
        const state = getState();
        streakEl.textContent = state.streak;
        highScoreEl.textContent = state.highScore;
        prevScoreEl.textContent =
          state.prevScore === null ? "-" : state.prevScore;
      }

      function renderMistakes() {
        const state = getState();
        mistakeCountEl.textContent = state.mistakes.length;
        replayBtnEl.disabled =
          state.mistakes.length === 0 && !state.isReplaying;

        if (state.isReplaying) {
          replayBtnEl.textContent = "Exit Replay";
          replayBtnEl.classList.add("active");
        } else {
          replayBtnEl.textContent = "Replay Mistakes";
          replayBtnEl.classList.remove("active");
        }

        if (state.mistakes.length === 0) {
          mistakeListEl.innerHTML =
            '<div class="mistake-empty">No mistakes yet</div>';
          return;
        }

        mistakeListEl.innerHTML = state.mistakes
          .map((m, idx) => {
            const isCurrent = state.isReplaying && idx === 0;
            return `
            <div class="mistake-item ${isCurrent ? "current" : ""}">
              <span class="mistake-hand">${m.hand}</span>
              <span class="mistake-pos">${m.pos}</span>
            </div>
          `;
          })
          .join("");
      }

      function toggleReplay() {
        const state = getState();
        clearTimeout(nextTimer);
        if (state.isReplaying) {
          state.isReplaying = false;
          nextCard();
          return;
        }
        if (state.mistakes.length === 0) return;
        state.isReplaying = true;
        nextCard();
      }

      function dealHand() {
        const c1 = Math.floor(Math.random() * 52);
        let c2 = Math.floor(Math.random() * 51);
        if (c2 >= c1) c2++;

        const r1 = c1 % 13,
          s1 = Math.floor(c1 / 13);
        const r2 = c2 % 13,
          s2 = Math.floor(c2 / 13);

        const high = Math.min(r1, r2);
        const low = Math.max(r1, r2);

        if (high === low) return RANKS[high] + RANKS[low];
        return RANKS[high] + RANKS[low] + (s1 === s2 ? "s" : "o");
      }

      function nextCard() {
        const state = getState();
        locked = false;
        boardEl.className = "board";
        feedbackEl.textContent = "";

        if (state.isReplaying) {
          if (state.mistakes.length === 0) {
            state.isReplaying = false;
          } else {
            currentPos = state.mistakes[0].pos;
            currentHand = state.mistakes[0].hand;
            posEl.textContent = currentPos;
            handEl.textContent = currentHand;
            replayBannerEl.style.display = "block";
            renderMistakes();
            return;
          }
        }

        replayBannerEl.style.display = "none";
        renderMistakes();
        currentPos =
          selectedMode === "Random"
            ? POSITIONS[Math.floor(Math.random() * POSITIONS.length)]
            : selectedMode;
        currentHand = dealHand();
        posEl.textContent = currentPos;
        handEl.textContent = currentHand;
      }

      function submitAnswer(action) {
        if (locked || activePage !== "trainer") return;
        locked = true;

        const state = getState();
        const shouldRaise = RANGES[currentPos].has(currentHand);
        const isCorrect = (action === "raise") === shouldRaise;

        if (state.isReplaying) {
          if (isCorrect) {
            state.mistakes.shift();
            boardEl.classList.add("correct");
            feedbackEl.textContent =
              state.mistakes.length > 0
                ? `Correct — removed (${state.mistakes.length} left)`
                : "Correct — all mistakes cleared!";
            feedbackEl.style.color = "#69db7c";
          } else {
            if (state.mistakes.length > 1) {
              state.mistakes.push(state.mistakes.shift());
            }
            boardEl.classList.add("wrong");
            feedbackEl.textContent = `Wrong — ${currentHand} from ${currentPos} is a ${shouldRaise ? "RAISE" : "FOLD"}`;
            feedbackEl.style.color = "#ff8787";
          }
          renderMistakes();
          nextTimer = setTimeout(nextCard, isCorrect ? 450 : 1200);
          return;
        }

        if (isCorrect) {
          state.streak++;
          if (state.streak > state.highScore) {
            state.highScore = state.streak;
          }
          boardEl.classList.add("correct");
          feedbackEl.textContent = `Correct (${shouldRaise ? "Raise" : "Fold"})`;
          feedbackEl.style.color = "#69db7c";
        } else {
          state.prevScore = state.streak;
          state.streak = 0;
          const alreadyInStack = state.mistakes.some(
            (m) => m.pos === currentPos && m.hand === currentHand,
          );
          if (!alreadyInStack) {
            state.mistakes.unshift({ pos: currentPos, hand: currentHand });
          }
          renderMistakes();
          boardEl.classList.add("wrong");
          feedbackEl.textContent = `Wrong — ${currentHand} from ${currentPos} is a ${shouldRaise ? "RAISE" : "FOLD"}`;
          feedbackEl.style.color = "#ff8787";
        }

        updateScoreboard();
        nextTimer = setTimeout(nextCard, isCorrect ? 450 : 1200);
      }

      replayBtnEl.addEventListener("click", toggleReplay);
      document
        .getElementById("foldBtn")
        .addEventListener("click", () => submitAnswer("fold"));
      document
        .getElementById("raiseBtn")
        .addEventListener("click", () => submitAnswer("raise"));

      document.addEventListener("keydown", (e) => {
        if (activePage !== "trainer") return;
        if (e.key === "ArrowLeft" || e.key.toLowerCase() === "f")
          submitAnswer("fold");
        if (e.key === "ArrowRight" || e.key.toLowerCase() === "r")
          submitAnswer("raise");
      });

      initTrainerModes();
      initChartToggles();
      updateScoreboard();
      nextCard();
    </script>
  </body>
</html>
